.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 18px #102d2207;overflow:hidden}.card-img{aspect-ratio:16/10;background:#ece7dd;display:grid;place-items:center;color:var(--muted)}.card-img img{width:100%;height:100%;object-fit:cover}.card-body{padding:14px}.card-title{font-size:15px;font-weight:920}.card-meta{color:var(--muted);font-size:11px;line-height:1.5;margin-top:4px}.card-actions{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}.card-actions .btn{font-size:11px;padding:8px 10px;flex:1}

x;min-height:44px;max-height:130px}.send{border:0;background:var(--forest2);color:white;border-radius:11px;padding:0 17px;font-weight:900}
.schedule-groups{display:grid;gap:18px}.schedule-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:900;margin-bottom:7px}.schedule-row{background:white;border:1px solid var(--line);border-radius:13px;padding:12px 13px;display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;margin-bottom:7px}.schedule-time{font-weight:950;color:var(--forest2)}.schedule-name{font-weight:850;font-size:13px}.schedule-address{font-size:10px;color:var(--muted);margin-top:2px}

/* AI HOUSE REVIEWS V2 */
.review-stack{display:grid;gap:18px}
.review-workspace{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 7px 26px #102d2210;overflow:hidden}
.review-top{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.review-top h3{margin:0;font-size:16px}.review-top-meta{font-size:11px;color:var(--muted);line-height:1.5;margin-top:4px}
.review-stage-badge{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:6px 10px;font-size:10px;font-weight:900;background:#f0ece3;color:#4e574f;white-space:nowrap}
.review-stage-badge.live{background:#e7eef7;color:var(--blue)}.review-stage-badge.ready{background:#e7f3eb;color:var(--good)}.review-stage-badge.failed{background:#fbe7e4;color:var(--bad)}
.review-stepper{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;background:#fbf9f4}
.review-step{position:relative;text-align:center;font-size:9px;color:#9ba39d;font-weight:850;padding-top:15px}
.review-step:before{content:"";position:absolute;top:2px;left:50%;transform:translateX(-50%);width:9px;height:9px;border-radius:50%;background:#d9d5cd;box-shadow:0 0 0 3px #f3efe7}
.review-step.done,.review-step.active{color:var(--forest2)}.review-step.done:before{background:var(--good)}.review-step.active:before{background:var(--gold);box-shadow:0 0 0 4px #eadbb866}
.review-main{padding:16px;display:grid;gap:15px}
.review-pane-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.review-pane{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#f3efe8}
.review-pane-head{padding:9px 11px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;font-weight:900}
.review-pane-actions{display:flex;gap:6px}.review-mini-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 8px;font-size:9px;font-weight:850;color:var(--ink)}
.review-image-stage{position:relative;aspect-ratio:16/10;background:#e9e4da;overflow:hidden;display:grid;place-items:center;touch-action:none}
.review-image-stage img{width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.review-image-stage.clickable img{cursor:zoom-in}.review-image-stage.pin-mode{outline:3px solid #c7a96b88;outline-offset:-3px}.review-image-stage.pin-mode img{cursor:crosshair}
.review-no-image{font-size:11px;color:var(--muted);padding:20px;text-align:center}
.review-pin{position:absolute;transform:translate(-50%,-50%);width:25px;height:25px;border-radius:50%;border:2px solid #fff;background:var(--red);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:950;box-shadow:0 3px 10px #0005;z-index:5}
.review-editor{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px}
.review-note-card,.review-history-card{border:1px solid var(--line);border-radius:13px;background:#fff;padding:12px}
.review-note-card label{margin:0 0 7px}.review-note-card textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:11px;padding:10px 11px;resize:vertical;outline:none}.review-note-card textarea:focus{border-color:var(--forest3);box-shadow:0 0 0 3px #24543e14}
.quick-tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.quick-chip{border:1px solid #e3dbcd;background:#faf7f0;border-radius:999px;padding:6px 9px;font-size:9px;font-weight:850;color:#445048}
.review-pin-list{display:grid;gap:5px;margin-top:10px}.review-pin-row{display:grid;grid-template-columns:24px 1fr auto;gap:7px;align-items:start;background:#faf7f1;border:1px solid #eee7dc;border-radius:9px;padding:7px}
.review-pin-num{width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:9px;font-weight:950}.review-pin-note{font-size:10px;line-height:1.4}.review-pin-remove{border:0;background:transparent;color:var(--bad);font-weight:900}
.review-history-title{font-size:11px;font-weight:950;margin-bottom:8px}.review-history{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px}
.review-version{flex:0 0 112px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px;text-align:left}.review-version.active{border-color:var(--forest3);box-shadow:0 0 0 2px #24543e18}
.review-version-img{height:62px;border-radius:7px;background:#eee9e0;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:9px}.review-version-img img{width:100%;height:100%;object-fit:cover}
.review-version strong{display:block;font-size:9px;margin-top:5px}.review-version small{display:block;font-size:8px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.review-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.review-actions .btn{font-size:11px}.review-actions .grow{margin-right:auto}.review-regenerating-note{font-size:10px;color:var(--muted)}
.review-lightbox{position:fixed;inset:0;background:#06110dec;z-index:120;display:flex;flex-direction:column}
.review-lightbox.hidden{display:none!important}.review-lightbox-bar{height:56px;padding:9px 12px;display:flex;gap:7px;align-items:center;background:#0d2119;color:#fff;border-bottom:1px solid #ffffff20}.review-lightbox-title{font-size:12px;font-weight:900;margin-right:auto}
.review-lightbox-btn{border:1px solid #ffffff30;background:#ffffff10;color:#fff;border-radius:9px;padding:7px 10px;font-weight:900}.review-lightbox-stage{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab}.review-lightbox-stage.dragging{cursor:grabbing}
.review-lightbox-img{position:absolute;left:50%;top:50%;max-width:none;max-height:none;transform-origin:center center;user-select:none;-webkit-user-drag:none;will-change:transform}
@media(max-width:980px){.review-editor{grid-template-columns:1fr}.review-history-card{order:2}}
@media(max-width:820px){.review-pane-grid{grid-template-columns:1fr}.review-stepper{gap:2px;padding:10px 8px}.review-step{font-size:8px}.review-main{padding:11px}.review-top{padding:12px}.review-actions .btn{flex:1 1 45%}}
@media(max-width:520px){.review-step span{display:none}.review-step:after{content:attr(data-short);display:block;font-size:7px}.review-version{flex-basis:94px}.review-version-img{height:54px}.review-lightbox-title{display:none}}


/* Lead controls and bounded message scrolling */

.lm-tools{margin:14px 0}.lm-tools label{display:grid;gap:6px;flex:1;min-width:145px;margin:0}
.lm-tools input,.lm-tools select{width:100%;min-width:0;min-height:44px;padding:10px;border:1px solid var(--line);border-radius:10px;background:white}
.lm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;margin:16px 0}
.lm-card{min-width:0;padding:16px;background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow-wrap:anywhere}
.lm-card header{display:flex;gap:10px;align-items:center}.lm-card h3{margin:0;font-size:17px}.lm-card p{font-size:13px;line-height:1.5}.lm-muted{color:#59675e;font-size:12px}
.lm-card footer{display:flex;gap:10px;flex-wrap:wrap}.lm-actions .btn-dark:hover{background:var(--forest);color:white}.lm-note{padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--paper);font-size:13px;line-height:1.6;overflow-wrap:anywhere}
.lm-protected{color:#825314;background:#faf0dd;border-radius:8px;padding:10px}.lm-note ul{padding-left:20px}
.lm-actions .lm-select-all,.lm-card .lm-pick{display:flex;align-items:center;gap:8px;min-height:44px;margin:0}.lm-pick{min-width:44px;justify-content:center}
#leadManager input[type=checkbox]{width:22px;height:22px;margin:0}#leadManager .btn{min-height:44px}#leadManager button:disabled{opacity:.5;cursor:not-allowed}#lmCount{font-size:12px}
.messages-layout{min-height:0;height:calc(100vh - 112px);height:calc(100dvh - 112px);grid-template-rows:minmax(0,1fr)}
.thread-pane,.chat-pane,#chatInner{min-height:0;min-width:0;overflow:hidden}.thread-head,.chat-head,.composer{flex-shrink:0}
.thread-list,.messages{min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.msg-row{flex-shrink:0}.composer{grid-template-columns:minmax(0,1fr) auto}.composer textarea{min-width:0}.chat-head>div{min-width:0;overflow-wrap:anywhere}
@media(max-width:760px){.messages-layout{height:calc(100vh - 86px);height:calc(100dvh - 86px)}.search-wrap{min-width:0}.lm-tools label{flex-basis:100%}.toast-wrap{max-width:calc(100vw - 36px)}.toast{min-width:0}}

<script type="module">
import {renderLeadManager} from "./lead-manager.js";
import {renderProductEngine} from "./product-engine.js";
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const SUPABASE_URL="https://gidqdlcvyasqalitqvcn.supabase.co";
const SUPABASE_KEY="sb_publishable_bHlbA15kDnpoG4VA25rK0A_ollbphf0";
const sb=createClient(SUPABASE_URL,SUPABASE_KEY);
const urls={
  ops:SUPABASE_URL+"/functions/v1/admin-ops-api",
  inbox:SUPABASE_URL+"/functions/v1/sms-inbox-api",
  send:SUPABASE_URL+"/functions/v1/send-sms",
  reviews:SUPABASE_URL+"/functions/v1/review-previews-api"
};
let currentView="dashboard",messages=[],selectedPhone=null,msgPoll=null,searchTimer=null;
const el=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>"$"+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const dt=v=>v?new Date(v).toLocaleString([],{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"—";
const dte=v=>v?new Date(v).toLocaleDateString([],{month:"short",day:"numeric",year:"numeric"}):"—";
const phone=v=>{let d=String(v||"").replace(/\D/g,"");if(d.length===11&&d[0]==="1")d=d.slice(1);return d.length===10?"("+d.slice(0,3)+") "+d.slice(3,6)+"-"+d.slice(6):v||"—"};
function statusBadge(v){const s=String(v||"Not set"),l=s.toLowerCase();let c="";if(["paid","delivered","booked","completed","approved","scheduled"].some(x=>l.includes(x)))c="good";else if(["failed","undelivered","cancelled","rejected","lost"].some(x=>l.includes(x)))c="bad";else if(["awaiting","pending","locked","needs","new lead"].some(x=>l.includes(x)))c="warn";else if(["processing","queued","sent"].some(x=>l.includes(x)))c="blue";return '<span class="badge '+c+'">'+esc(s.replaceAll("_"," "))+'</span>'}
function loading(){el("content").innerHTML='<div class="loading"><span class="spinner"></span> Loading…</div>'}
function toast(msg,type="good"){const n=document.createElement("div");n.className="toast "+type;n.textContent=msg;el("toastWrap").appendChild(n);setTimeout(()=>n.remove(),3500)}
async function session(){return (await sb.auth.getSession()).data.session}
async function authFetch(url,opts={}){const s=await session();if(!s)throw new Error("Not signed in");const h={...(opts.headers||{}),Authorization:"Bearer "+s.access_token,apikey:SUPABASE_KEY};if(opts.body)h["Content-Type"]="application/json";const r=await fetch(url,{...opts,headers:h});const j=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401){logout()}const error=new Error(j.error||j.twilio_message||"Request failed");error.status=r.status;error.data=j;throw error}return j}
async function ops(view,params={}){const u=new URL(urls.ops);u.searchParams.set("view",view);Object.entries(params).forEach(([k,v])=>{if(v!==undefined&&v!==null)u.searchParams.set(k,String(v))});return authFetch(u)}
function titleFor(v){return ({dashboard:"Dashboard",messages:"Messages",leads:"Leads",trash:"Trash",quotes:"Quotes",reviews:"AI House Reviews",jobs:"Jobs",schedule:"Schedule",payments:"Payments",customers:"Customers",products:"Product Engine"})[v]||"Admin"}
function setActiveNav(){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===currentView));el("pageTitle").textContent=titleFor(currentView)}
function closeMobile(){el("sidebar").classList.remove("open");el("mobileOverlay").classList.remove("show")}
async function navigate(view,push=true){currentView=view;setActiveNav();closeMobile();clearInterval(msgPoll);if(push)history.replaceState(null,"","#"+view);loading();try{if(view==="dashboard")await renderDashboard();else if(view==="messages"){await renderMessages();msgPoll=setInterval(()=>{if(currentView==="messages")loadMessages(false)},15000)}else if(view==="leads"||view==="trash")await renderLeads(view==="trash");else if(view==="quotes")await renderQuotes();else if(view==="reviews")await renderReviews();else if(view==="jobs")await renderJobs();else if(view==="schedule")await renderSchedule();else if(view==="payments")await renderPayments();else if(view==="customers")await renderCustomers();else if(view==="products")await renderProductEngine({el,esc,authFetch,toast,openDetail})}catch(e){el("content").innerHTML='<div class="panel"><div class="empty"><strong>Could not load '+esc(titleFor(view))+'</strong>'+esc(e.message)+'</div></div>';toast(e.message,"bad")}}
async function renderDashboard(){const j=await ops("dashboard");const m=j.metrics||{};el("navUnread").textContent=m.unread_messages||0;el("navUnread").classList.toggle("hidden",!m.unread_messages);el("navReviews").textContent=m.previews_waiting||0;el("navReviews").classList.toggle("hidden",!m.previews_waiting);
 const metrics=[
  ["New leads",m.new_leads||0,"Awaiting follow-up"],
  ["AI reviews",m.previews_waiting||0,"Waiting for approval"],
  ["Deposits collected",money(m.deposits_collected),"Posted payments"],
  ["Outstanding",money(m.outstanding),"Quoted minus collected"],
  ["Jobs booked",m.jobs_booked||0,"Scheduled installs"],
  ["Next 7 days",m.installs_next_7_days||0,"Upcoming installs"],
  ["Unread messages",m.unread_messages||0,"Customer replies"],
  ["Revenue collected",money(m.revenue_collected),"Deposits recorded"]
 ];
 let html='<div class="section-head"><div><h2>Good morning</h2><p>What needs attention across Maceda Lighting.</p></div><button id="dashRefresh" class="btn">Refresh</button></div><div class="metrics">'+metrics.map(x=>'<div class="metric"><div class="metric-label">'+x[0]+'</div><div class="metric-value">'+x[1]+'</div><div class="metric-foot">'+x[2]+'</div></div>').join("")+'</div>';
 html+='<div class="dashboard-grid"><div class="panel"><div class="panel-head"><h3>Action needed</h3></div><div class="panel-body"><div class="action-list">'+((j.actions||[]).length?(j.actions||[]).map(a=>'<button class="action '+esc(a.priority)+'" data-go="'+esc(a.type)+'"><span>'+esc(a.label)+'</span><small>Open →</small></button>').join(""):'<div class="empty"><strong>Nothing urgent</strong>Your queue is clear.</div>')+'</div></div></div>';
 html+='<div class="panel"><div class="panel-head"><h3>Upcoming installations</h3><button class="btn" data-go="schedule">View schedule</button></div><div class="panel-body">'+((j.upcoming||[]).length?(j.upcoming||[]).map(q=>'<div style="padding:9px 0;border-bottom:1px solid #eee9e1"><div class="linkish" data-detail="'+q.id+'">'+esc(q.name||"Customer")+'</div><div class="subtext">'+dt(q.cal_booking_start_at)+' • '+esc(q.address||"")+'</div></div>').join(""):'<div class="empty"><strong>No upcoming installs</strong></div>')+'</div></div></div>';
 el("content").innerHTML=html;wireCommon();el("dashRefresh").onclick=renderDashboard}
function tableHead(cols){return '<thead><tr>'+cols.map(c=>'<th>'+c+'</th>').join("")+'</tr></thead>'}
async function renderLeads(trash=false){await renderLeadManager({el,esc,ops,authFetch,url:urls.ops,openDetail,navigate},trash)}
async function renderQuotes(){const j=await ops("quotes",{limit:150});const items=j.items||[];let h='<div class="section-head"><div><h2>Quotes</h2><p>Pricing, deposits, package selection and quote status.</p></div><button class="btn" id="refreshView">Refresh</button></div><div class="panel table-wrap"><table class="table">'+tableHead(["Customer","Quote","Deposit","Package","Status","Created"])+'<tbody>';
 h+=items.map(q=>'<tr><td><div class="linkish" data-detail="'+q.id+'">'+esc(q.name||"Unnamed")+'</div><div class="subtext">'+esc(q.address||"")+'</div></td><td><strong>'+money(q.quote_amount)+'</strong></td><td>'+money(q.deposit_paid)+' / '+money(q.deposit_required)+'<div class="subtext">'+statusBadge(q.deposit_status)+'</div></td><td>'+esc(q.selected_package||"—")+'</td><td>'+statusBadge(q.status)+'</td><td>'+dte(q.created_at)+'</td></tr>').join("");
 h+='</tbody></table></div>';el("content").innerHTML=h;wireCommon();el("refreshView").onclick=renderQuotes}
async function renderJobs(){const j=await ops("jobs",{limit:150});const items=j.items||[];let h='<div class="section-head"><div><h2>Jobs</h2><p>Booked installations and crew execution.</p></div><button class="btn" id="refreshView">Refresh</button></div><div class="panel table-wrap"><table class="table">'+tableHead(["Customer","Install","Crew","Deposit","Job status","Balance"])+'<tbody>';
 h+=items.map(q=>'<tr><td><div class="linkish" data-detail="'+q.id+'">'+esc(q.name||"Unnamed")+'</div><div class="subtext">'+esc(q.address||"")+'</div></td><td>'+dt(q.cal_booking_start_at||q.installation_start_at)+'<div class="subtext">'+(q.cal_booking_end_at?"to "+dt(q.cal_booking_end_at):"")+'</div></td><td>'+esc(q.crew||"Unassigned")+'</td><td>'+statusBadge(q.deposit_status)+'</td><td>'+statusBadge(q.job_status||"Scheduled")+'</td><td>'+money(Math.max(0,Number(q.quote_amount||0)-Number(q.deposit_paid||0)))+'</td></tr>').join("");
 h+='</tbody></table></div>';el("content").innerHTML=h;wireCommon();el("refreshView").onclick=renderJobs}
async function renderPayments(){const j=await ops("payments",{limit:150});const items=j.items||[];let h='<div class="section-head"><div><h2>Payments</h2><p>Deposits, balances and Stripe checkout state.</p></div><button class="btn" id="refreshView">Refresh</button></div><div class="panel table-wrap"><table class="table">'+tableHead(["Customer","Quote total","Deposit required","Collected","Remaining","Status","Paid"])+'<tbody>';
 h+=items.map(q=>'<tr><td><div class="linkish" data-detail="'+q.id+'">'+esc(q.name||"Unnamed")+'</div><div class="subtext">'+esc(q.address||"")+'</div></td><td>'+money(q.quote_amount)+'</td><td>'+money(q.deposit_required)+'</td><td><strong>'+money(q.deposit_paid)+'</strong></td><td>'+money(Math.max(0,Number(q.quote_amount||0)-Number(q.deposit_paid||0)))+'</td><td>'+statusBadge(q.deposit_status)+'</td><td>'+dte(q.deposit_paid_at)+'</td></tr>').join("");
 h+='</tbody></table></div>';el("content").innerHTML=h;wireCommon();el("refreshView").onclick=renderPayments}
async function renderCustomers(){const j=await ops("customers",{limit:250});const items=j.items||[];let h='<div class="section-head"><div><h2>Customers</h2><p>One view of each customer and their history.</p></div><button class="btn" id="refreshView">Refresh</button></div><div class="cards">';
 h+=items.map(c=>'<div class="card customer-card"><div class="customer-top"><div><div class="customer-name">'+esc(c.name||"Customer")+'</div><div class="customer-contact">'+esc(phone(c.phone))+'<br>'+esc(c.email||"")+'<br>'+esc(c.address||"")+'</div></div><button class="btn" data-detail="'+c.latest_quote.id+'">Open</button></div><div class="customer-stats"><div class="customer-stat"><small>Quotes</small><strong>'+c.quote_count+'</strong></div><div class="customer-stat"><small>Quoted</small><strong>'+money(c.total_quoted)+'</strong></div><div class="customer-stat"><small>Paid</small><strong>'+money(c.total_paid)+'</strong></div></div></div>').join("");
 h+='</div>';el("content").innerHTML=h;wireCommon();el("refreshView").onclick=renderCustomers}
function scheduleBucket(q){const t=new Date(q.cal_booking_start_at||q.installation_start_at);const now=new Date();const startToday=new Date(now.getFullYear(),now.getMonth(),now.getDate());const startTomorrow=new Date(startToday.getTime()+86400000);const week=new Date(startToday.getTime()+7*86400000);if(t>=startToday&&t<startTomorrow)return "Today";if(t>=startTomorrow&&t<week)return "This Week";return "Upcoming"}
async function renderSchedule(){const j=await ops("schedule",{limit:200});const items=j.items||[];const groups={Today:[], "This Week":[], Upcoming:[]};items.forEach(q=>groups[scheduleBucket(q)].push(q));let h='<div class="section-head"><div><h2>Schedule</h2><p>Cal.com bookings and installation blocks. Typical duration: 4 hours.</p></div><button class="btn" id="refreshView">Refresh</button></div><div class="schedule-groups">';
 for(const name of ["Today","This Week","Upcoming"]){h+='<div><div class="schedule-label">'+name+'</div>'+(groups[name].length?groups[name].map(q=>'<div class="schedule-row"><div class="schedule-time">'+new Date(q.cal_booking_start_at||q.installation_start_at).toLocaleString([],{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})+'</div><div><div class="schedule-name linkish" data-detail="'+q.id+'">'+esc(q.name||"Customer")+'</div><div class="schedule-address">'+esc(q.address||"")+' • '+esc(q.crew||"Unassigned crew")+'</div></div>'+statusBadge(q.job_status||q.cal_booking_status||"Booked")+'</div>').join(""):'<div class="panel"><div class="empty">No installations.</div></div>')+'</div>'}
 h+='</div>';el("content").innerHTML=h;wireCommon();el("refreshView").onclick=renderSchedule}

const reviewDraftState=new Map();
let reviewPollTimer=null;
let reviewLightboxState={scale:1,x:0,y:0,pointers:new Map(),dragStart:null,pinchStart:null};

function reviewStageLabel(s){
 const m={queued:"Queued",analyzing_house:"Analyzing House",generating:"Generating",accuracy_check:"Accuracy Check",ready_for_review:"Ready for Review",historical:"Historical",approved:"Approved",rejected:"Rejected",failed:"Failed"};
 return m[s]||String(s||"Unknown").replaceAll("_"," ");
}
function reviewStageClass(s){return s==="ready_for_review"?"ready":s==="failed"?"failed":["queued","analyzing_house","generating","accuracy_check"].includes(s)?"live":""}
function reviewPipeline(s){
 const steps=[["queued","Queued","Queue"],["analyzing_house","Analyzing House","Analyze"],["generating","Generating","Generate"],["accuracy_check","Accuracy Check","Check"],["ready_for_review","Ready for Review","Ready"]];
 const idx=Math.max(0,steps.findIndex(x=>x[0]===s));
 return '<div class="review-stepper">'+steps.map((x,i)=>'<div class="review-step '+(s==="failed"?"":i<idx?"done":i===idx?"active":"")+'" data-short="'+x[2]+'"><span>'+x[1]+'</span></div>').join("")+'</div>';
}
function reviewDraft(q){
 let d=reviewDraftState.get(q.id);
 if(!d){d={note:"",pins:[],pinMode:false,selectedVersionId:q.current_version_id||null,followCurrent:true};reviewDraftState.set(q.id,d)}
 if(d.followCurrent&&q.current_version_id)d.selectedVersionId=q.current_version_id;
 return d;
}
function reviewVersion(q,d){
 const versions=q.versions||[];
 const requested=versions.find(v=>v.id===d.selectedVersionId);
 if(requested&&requested.preview_url)return requested;
 return versions.find(v=>v.preview_url)||requested||null;
}
function reviewQuickText(key){
 const m={
  remove:"Remove unwanted lights from the specified area while preserving the house exactly.",
  add:"Add professional Christmas lights only to the specified existing architectural area.",
  color:"Change only the requested lighting color; preserve placement and architecture.",
  architecture:"Fix any architectural distortion so the generated property matches the original house exactly.",
  preserve:"Preserve the exact house, landscaping, objects, camera angle, framing, and proportions.",
  darker:"Make the overall scene a slightly darker, believable dusk/evening while preserving property details.",
  brighter:"Make the installed lights brighter and clearer without overexposing or changing the property.",
  less:"Reduce decorations and keep the design cleaner and more premium.",
  more:"Add tasteful premium decorations only where physically plausible and without blocking access.",
  wreath:"Add a tasteful wreath at the specified appropriate existing location.",
  garland:"Add tasteful garland only to the specified appropriate existing architectural feature."
 };
 return m[key]||"";
}
function appendReviewQuick(id,key){
 const d=reviewDraftState.get(id);if(!d)return;
 const t=reviewQuickText(key);if(!t)return;
 d.note=(d.note?d.note.trim()+"\n":"")+t;
 const ta=document.querySelector('[data-review-note="'+id+'"]');if(ta)ta.value=d.note;
}
function addReviewPin(id,event){
 const d=reviewDraftState.get(id);if(!d||!d.pinMode)return;
 const stage=event.currentTarget,img=stage.querySelector("img");
 if(!img)return;
 const rect=stage.getBoundingClientRect();
 const iw=img.naturalWidth||1,ih=img.naturalHeight||1;
 const scale=Math.min(rect.width/iw,rect.height/ih);
 const shownW=iw*scale,shownH=ih*scale;
 const left=rect.left+(rect.width-shownW)/2,top=rect.top+(rect.height-shownH)/2;
 const px=event.clientX-left,py=event.clientY-top;
 if(px<0||py<0||px>shownW||py>shownH){toast("Click directly on the house image, not the empty margin.","bad");return}
 const x=Math.max(0,Math.min(1,px/shownW));
 const y=Math.max(0,Math.min(1,py/shownH));
 const note=prompt("Correction for this exact point:");
 if(!note||!note.trim())return;
 d.pins.push({x,y,note:note.trim()});
 d.pinMode=false;
 paintReviewPins(id);
 const btn=document.querySelector('[data-pin-toggle="'+id+'"]');if(btn)btn.textContent="Add Pin";
 stage.classList.remove("pin-mode");
}
function paintReviewPins(id){
 const d=reviewDraftState.get(id);if(!d)return;
 const stage=document.querySelector('[data-pin-stage="'+id+'"]');
 if(stage){
  stage.querySelectorAll(".review-pin").forEach(n=>n.remove());
  d.pins.forEach((p,i)=>{const n=document.createElement("button");n.type="button";n.className="review-pin";n.textContent=String(i+1);n.style.left=(p.x*100)+"%";n.style.top=(p.y*100)+"%";n.title=p.note;n.onclick=e=>{e.stopPropagation();};stage.appendChild(n)});
 }
 const list=document.querySelector('[data-pin-list="'+id+'"]');
 if(list)list.innerHTML=d.pins.map((p,i)=>'<div class="review-pin-row"><span class="review-pin-num">'+(i+1)+'</span><span class="review-pin-note">'+esc(p.note)+'</span><button class="review-pin-remove" data-remove-pin="'+i+'">×</button></div>').join("");
 document.querySelectorAll('[data-review="'+id+'"] [data-remove-pin]').forEach(b=>b.onclick=()=>{d.pins.splice(Number(b.dataset.removePin),1);paintReviewPins(id)});
}
function toggleReviewPin(id){
 const d=reviewDraftState.get(id);if(!d)return;d.pinMode=!d.pinMode;
 const stage=document.querySelector('[data-pin-stage="'+id+'"]'),btn=document.querySelector('[data-pin-toggle="'+id+'"]');
 if(stage)stage.classList.toggle("pin-mode",d.pinMode);
 if(btn)btn.textContent=d.pinMode?"Click Image…":"Add Pin";
}
function ensureReviewLightbox(){
 let lb=document.getElementById("reviewLightbox");if(lb)return lb;
 lb=document.createElement("div");lb.id="reviewLightbox";lb.className="review-lightbox hidden";

async function handleReviewV2(btn,q,items){

  if(!v||!v.image_path)return toast("Select a completed preview version first.","bad");

  if(!v||!v.image_path)return toast("Select a completed preview version first.","bad");
  const note=prompt("Optional internal rejection note:",d.note||"");if(note===null)return;d.note=note;

 try{
  const body={quote_id:id,action};

  if(action==="reject")body.note=d.note||null;
  if(action==="regenerate"){body.note=d.note.trim()||null;body.pins=d.pins;d.followCurrent=true}
  const j=await authFetch(urls.reviews,{method:"POST",body:JSON.stringify(body)});

  await renderReviews();

}

el("loginForm").onsubmit=login;el("logoutBtn").onclick=logout;el("menuBtn").onclick=()=>{el("sidebar").classList.toggle("open");el("mobileOverlay").classList.toggle("show")};el("mobileOverlay").onclick=closeMobile;el("closeModal").onclick=()=>el("detailModal").classList.add("hidden");el("detailModal").onclick=e=>{if(e.target===el("detailModal"))el("detailModal").classList.add("hidden")};el("globalSearch").oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(doSearch,280)};document.addEventListener("click",e=>{if(!e.target.closest(".search-wrap"))el("searchResults").classList.add("hidden")});
const s=await session();if(s)showApp();
</script>
